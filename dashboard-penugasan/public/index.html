<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard Pemantauan Penugasan — Inspektorat Wilayah III</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<!-- LAYAR LOGIN -->
<div id="view-login" class="login-screen">
  <div class="login-card">
    <div class="login-seal">IW3</div>
    <h1>Dashboard Pemantauan Penugasan</h1>
    <p class="login-sub">Inspektorat Wilayah III</p>
    <form id="form-login" autocomplete="off">
      <label for="login-username">Username</label>
      <input type="text" id="login-username" name="username" required autocomplete="username" />
      <label for="login-password">Password</label>
      <input type="password" id="login-password" name="password" required autocomplete="current-password" />
      <div id="login-error" class="form-error" role="alert" hidden></div>
      <button type="submit" class="btn btn-primary btn-block">Masuk</button>
    </form>
  </div>
</div>

<!-- LAYAR APLIKASI UTAMA -->
<div id="view-app" class="app-shell" hidden>
  <aside class="sidebar">
    <div class="sidebar-brand">
      <span class="seal-mini">IW3</span>
      <div>
        <div class="brand-title">Pemantauan Penugasan</div>
        <div class="brand-sub">Itwil III</div>
      </div>
    </div>
    <nav class="sidebar-nav">
      <button class="nav-link" data-view="dashboard">Dashboard</button>
      <button class="nav-link" data-view="penugasan">Daftar Penugasan</button>
      <button class="nav-link" data-view="pegawai" data-admin-only>Data Pegawai</button>
      <button class="nav-link" data-view="users" data-admin-only>Akun Pengguna</button>
    </nav>
    <div class="sidebar-footer">
      <button id="btn-change-password" class="link-btn">Ganti password</button>
      <button id="btn-logout" class="link-btn">Keluar</button>
    </div>
  </aside>

  <main class="main-content">
    <header class="topbar">
      <div id="topbar-title">Dashboard</div>
      <div class="topbar-user">
        <span id="user-nama"></span>
        <span id="user-role" class="badge-role"></span>
      </div>
    </header>

    <div id="toast" class="toast" hidden></div>

    <section id="view-dashboard" class="view"></section>
    <section id="view-penugasan" class="view" hidden></section>
    <section id="view-pegawai" class="view" hidden></section>
    <section id="view-users" class="view" hidden></section>
  </main>
</div>

<!-- MODAL GENERIK -->
<div id="modal-overlay" class="modal-overlay" hidden>
  <div class="modal-box" id="modal-box"></div>
</div>

<script src="/js/app.js"></script>
</body>
</html>
